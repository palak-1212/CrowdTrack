<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>CrowdTrack · Crowd Intelligence System</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Syne:wght@400;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:         #020d18;
  --surface:    rgba(3,16,30,0.96);
  --surface2:   rgba(4,22,40,0.82);
  --border:     rgba(0,229,255,0.15);
  --border2:    rgba(0,229,255,0.28);
  --accent:     #00e5ff;
  --accent2:    #00bcd4;
  --teal:       #1de9b6;
  --warn:       #ff9800;
  --danger:     #ff1744;
  --info:       #00b0ff;
  --success:    #00e676;
  --low:        #00e5ff;
  --med:        #ff9800;
  --high:       #ff1744;
  --text:       #e0f7fa;
  --muted:      rgba(178,235,242,0.6);
  --muted2:     rgba(128,203,214,0.45);
  --font-mono:  'JetBrains Mono',monospace;
  --font:       'Syne',sans-serif;
  --font-d:     'Orbitron',monospace;
  --nav-w:      250px;
  --tr:         0.3s cubic-bezier(0.4,0,0.2,1);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font)}


#bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(ellipse 80% 60% at 18% -8%, rgba(0,188,212,0.2) 0%,transparent 55%),
  radial-gradient(ellipse 60% 50% at 85% 105%, rgba(0,96,125,0.25) 0%,transparent 55%),
  linear-gradient(160deg,#020d18 0%,#031a2e 45%,#041f35 72%,#020d18 100%);}
#grid-svg{position:fixed;inset:0;z-index:0;width:100%;height:100%;pointer-events:none;opacity:.16}
#scanline{position:fixed;top:-2px;left:0;right:0;height:2px;z-index:1;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scanAnim 6s linear infinite;pointer-events:none;opacity:.45}
@keyframes scanAnim{from{top:-2px}to{top:100vh}}
.screen{display:none;min-height:100vh;position:fixed;inset:0;z-index:50}
.screen.active{display:flex;flex-direction:column}

#s-login{align-items:center;justify-content:center;background:var(--bg);overflow:hidden}
.login-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,229,255,0.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.07) 1px,transparent 1px);background-size:40px 40px;animation:gridDrift 8s linear infinite;opacity:.5}
@keyframes gridDrift{0%{background-position:0 0,0 0}100%{background-position:0 40px,0 0}}
.login-box{position:relative;z-index:2;width:100%;max-width:420px;padding:42px 36px;background:rgba(3,16,30,0.97);border:1px solid var(--border2);border-radius:8px;margin:20px;box-shadow:0 0 60px rgba(0,229,255,0.1),0 0 0 1px rgba(0,229,255,0.05)}
.login-badge{display:flex;align-items:center;gap:14px;margin-bottom:32px}
.login-badge-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--accent),var(--teal));clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:11px;color:#020d18;font-weight:900;flex-shrink:0;animation:hexPulse 3s ease-in-out infinite}
@keyframes hexPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,229,255,.4)}50%{box-shadow:0 0 20px 6px rgba(0,229,255,.15)}}
.login-badge-text{font-size:.62rem;font-family:var(--font-mono);color:var(--muted2);line-height:1.6;text-transform:uppercase;letter-spacing:.1em}
.login-badge-text strong{display:block;font-size:1.05rem;color:var(--text);text-transform:none;letter-spacing:0;font-family:var(--font-d);font-weight:700;color:var(--accent)}
.login-divider{height:1px;background:var(--border2);margin-bottom:28px}
.login-label{font-size:.68rem;font-family:var(--font-mono);color:var(--muted2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.login-input{width:100%;padding:12px 14px;background:rgba(0,229,255,.04);border:1px solid var(--border2);border-radius:4px;color:var(--text);font-family:var(--font-mono);font-size:.9rem;margin-bottom:16px;outline:none;transition:border-color .2s}
.login-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,229,255,.1)}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#020d18;border:none;border-radius:4px;font-family:var(--font-d);font-size:.78rem;font-weight:700;letter-spacing:2px;cursor:pointer;transition:opacity .15s,box-shadow .2s;margin-top:4px}
.login-btn:hover{opacity:.9;box-shadow:0 0 24px rgba(0,229,255,.3)}
.login-error{display:none;font-size:.74rem;font-family:var(--font-mono);color:var(--danger);margin-top:12px;text-align:center}
.login-footer{font-size:.63rem;font-family:var(--font-mono);color:var(--muted2);margin-top:24px;text-align:center;line-height:1.9}

#s-main{flex-direction:row!important}
#app{position:relative;z-index:2;display:flex;height:100vh;width:100vw;overflow:hidden}

.sidebar{width:var(--nav-w);min-height:100vh;background:rgba(2,10,22,0.97);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:50;backdrop-filter:blur(20px);overflow:hidden;transition:transform .25s}
.sidebar::after{content:'';position:absolute;right:0;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,var(--accent),var(--teal),transparent);animation:borderGlow 4s ease-in-out infinite alternate}
@keyframes borderGlow{from{opacity:.3}to{opacity:1}}

.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.sidebar-logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--teal));clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:10px;color:#020d18;font-weight:900;flex-shrink:0;animation:hexPulse 3s ease-in-out infinite}
.sidebar-logo-text{font-family:var(--font-d);font-size:.82rem;font-weight:700;color:var(--accent);letter-spacing:2px}
.sidebar-logo-sub{font-size:.58rem;font-family:var(--font-mono);color:var(--muted2);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}

.sidebar-nav{flex:1;padding:10px 0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.sidebar-nav::-webkit-scrollbar{display:none}
.nav-section-title{font-size:.56rem;font-family:var(--font-mono);color:var(--muted2);text-transform:uppercase;letter-spacing:.14em;padding:14px 18px 6px;opacity:.7}
.nav-link{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:.8rem;font-weight:500;color:var(--muted);cursor:pointer;transition:all .2s;border-left:2px solid transparent;position:relative;overflow:hidden}
.nav-link::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,229,255,.08),transparent);opacity:0;transition:opacity .2s}
.nav-link:hover::before,.nav-link.active::before{opacity:1}
.nav-link svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0;position:relative;z-index:1}
.nav-link span.label{position:relative;z-index:1}
.nav-link:hover{color:var(--text)}
.nav-link.active{color:var(--accent);border-left-color:var(--accent)}

.sidebar-user{border-top:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;gap:10px}
.user-avatar{width:30px;height:30px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:.62rem;font-weight:700;color:var(--accent);flex-shrink:0}
.user-meta{flex:1;min-width:0}
.user-name{font-size:.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:.6rem;font-family:var(--font-mono);color:var(--muted2);text-transform:uppercase;letter-spacing:.08em}
.logout-btn{background:none;border:none;color:var(--muted2);cursor:pointer;padding:4px;border-radius:3px;transition:color .15s}
.logout-btn:hover{color:var(--danger)}
.logout-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

.main-content{margin-left:var(--nav-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{padding:0 24px;height:54px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(2,10,22,.97);position:sticky;top:0;z-index:40;backdrop-filter:blur(10px);box-shadow:0 1px 20px rgba(0,0,0,.4)}
.topbar-left{display:flex;align-items:center;gap:14px}
.topbar-title{font-family:var(--font-d);font-size:.78rem;font-weight:700;letter-spacing:2px;color:var(--accent)}
.live-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(0,229,255,.07);border:1px solid rgba(0,229,255,.2);color:var(--accent);font-size:.62rem;font-family:var(--font-mono);font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:2px}
.live-dot{width:5px;height:5px;background:var(--accent);border-radius:50%;animation:blink 1.2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-time{font-size:.72rem;font-family:var(--font-mono);color:var(--muted)}
.alert-badge{position:relative;cursor:pointer;background:none;border:none;color:var(--muted);display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:3px;transition:all .15s}
.alert-badge:hover{background:var(--surface2);color:var(--text)}
.alert-badge svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}
.badge-count{position:absolute;top:2px;right:2px;min-width:14px;height:14px;background:var(--danger);border-radius:7px;font-size:.52rem;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);padding:0 3px;animation:badgePulse 1.5s ease-in-out infinite}
@keyframes badgePulse{0%,100%{opacity:1}50%{opacity:.65}}

.page-body{padding:24px;flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--accent2) transparent}
.page-body::-webkit-scrollbar{width:4px}
.page-body::-webkit-scrollbar-track{background:transparent}
.page-body::-webkit-scrollbar-thumb{background:var(--accent2);border-radius:2px}
