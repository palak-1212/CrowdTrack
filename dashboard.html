<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>CrowdTrack · Crowd Intelligence System</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Syne:wght@400;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:         #020d18;
  --surface:    rgba(3,16,30,0.96);
  --surface2:   rgba(4,22,40,0.82);
  --border:     rgba(0,229,255,0.15);
  --border2:    rgba(0,229,255,0.28);
  --accent:     #00e5ff;
  --accent2:    #00bcd4;
  --teal:       #1de9b6;
  --warn:       #ff9800;
  --danger:     #ff1744;
  --info:       #00b0ff;
  --success:    #00e676;
  --low:        #00e5ff;
  --med:        #ff9800;
  --high:       #ff1744;
  --text:       #e0f7fa;
  --muted:      rgba(178,235,242,0.6);
  --muted2:     rgba(128,203,214,0.45);
  --font-mono:  'JetBrains Mono',monospace;
  --font:       'Syne',sans-serif;
  --font-d:     'Orbitron',monospace;
  --nav-w:      250px;
  --tr:         0.3s cubic-bezier(0.4,0,0.2,1);
}
